# cellward (formerly vpn-zones): WirePlumber's policy for the zones' PipeWire clients
# (docs/LEAK-MODEL.md §20, policy.lua beside this file).
#
# Written as text, not rendered from Nix: builtins.toJSON quotes every
# string, and WirePlumber 0.5.14 takes a quoted feature name in `wants` with
# its quotes ("no component provides '"custom.vpn-zones.policy"'") — which
# fails the whole profile, and the session has no sound at all.
#
# The same file for the NixOS module (services.cellward.pipewirePolicy) and
# for home-manager without NixOS (programs.cellward.pipewirePolicy), under
# the same name: both on, the user's copy replaces the system's.

wireplumber.components = [
  {
    name = vpn-zones/policy.lua, type = script/lua
    provides = custom.vpn-zones.policy
  }
  # Wanted, not required: a script that fails to load must not take the
  # session's sound with it. Not loaded, it sets no marker, and the zones'
  # helpers hand no socket out — the zones have the pulse path only.
  {
    type = virtual, provides = custom.vpn-zones
    wants = [ custom.vpn-zones.policy ]
  }
]

wireplumber.profiles = {
  main = {
    custom.vpn-zones = required
  }
}

# A zone's client gets no default permission: without this rule WirePlumber
# 0.5.14 gives a "restricted" client read and execute on everything. The
# script grants per object, and sets its marker only when it sees this rule
# in force.
access.rules = [
  {
    matches = [
      {
        pipewire.sec.engine = "vpn-zone"
      }
    ]
    actions = {
      update-props = {
        default_permissions = "-"
      }
    }
  }
]
